<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>طلبات العملاء</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
            text-align: center;
            color: #111;
        }

        .empty {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            color: #666;
        }

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.04);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .order-header h3 {
            margin: 0;
        }

        .meta {
            color: #555;
            line-height: 1.8;
            font-size: 15px;
        }

        .items {
            margin-top: 15px;
            list-style: none;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .items li {
            background: #fafafa;
            border: 1px solid #f1f1f1;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .total {
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
            color: #111;
        }

        .badge {
            display: inline-block;
            background: #111;
            color: #fff;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
        }

        .badge.whatsapp {
            background: #25d366;
        }

        .badge.site {
            background: #0d6efd;
        }

        /* تنسيقات شاشة تسجيل الدخول */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 90%;
            max-width: 380px;
            border: 1px solid #eee;
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .login-box input:focus {
            border-color: #111;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #333;
        }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <!-- شاشة تسجيل الدخول -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>تسجيل الدخول للوحة الطلبات</h2>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" />
            <button onclick="checkPassword()">دخول</button>
            <div id="errorMsg" class="error-msg">كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- محتوى الصفحة الأصلي (مخفي حتى إدخال كلمة المرور) -->
    <div id="mainContent" class="container" style="display: none;">
        <h1>طلبات العملاء</h1>
        <div id="ordersContainer" class="orders"></div>
    </div>

    <script>
        // تحديد كلمة المرور هنا
        const SECRET_PASSWORD = "123456"; 

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (input === SECRET_PASSWORD) {
                // حفظ الجلسة في المتصفح لعدم إعادة طلب كلمة المرور عند التحديث
                sessionStorage.setItem('is_admin_logged_in', 'true');
                showProtectedContent();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // إمكانية الضغط على زر Enter لإرسال كلمة المرور
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function showProtectedContent() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            renderOrders();
        }

        function getOrders() {
            try {
                const saved = localStorage.getItem('streetwear_orders');
                if (saved) return JSON.parse(saved);
            } catch (error) {
                console.warn('localStorage failed, fallback to sessionStorage', error);
            }

            try {
                const savedSession = sessionStorage.getItem('streetwear_orders');
                if (savedSession) return JSON.parse(savedSession);
            } catch (error) {
                console.warn('sessionStorage failed', error);
            }

            return [];
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const orders = getOrders();

            if (!orders.length) {
                container.innerHTML = '<div class="empty">لا توجد طلبات حتى الآن.<br>قم بإرسال طلب من صفحة المتجر ثم أعد فتح هذه الصفحة.</div>';
                return;
            }

            container.innerHTML = orders.slice().reverse().map(order => {
                const itemsHtml = (order.items || []).map(item => `
          <li>
            <span>${item.title}</span>
            <span>${item.selectedColor} / ${item.selectedSize}</span>
            <span>الكمية: ${item.qty}</span>
            <span>${item.price * item.qty} ج.م</span>
          </li>
        `).join('');

                return `
          <div class="order-card">
            <div class="order-header">
              <h3>${order.name}</h3>
              <span class="badge ${order.mode === 'whatsapp' ? 'whatsapp' : 'site'}">
                ${order.mode === 'whatsapp' ? 'واتساب' : 'من الموقع'}
              </span>
            </div>

            <div class="meta">
              <div>الهاتف: ${order.phone}</div>
              <div>التاريخ: ${new Date(order.createdAt).toLocaleString('ar-EG')}</div>
              ${order.notes ? `<div>ملاحظات: ${order.notes}</div>` : ''}
            </div>

            <ul class="items">${itemsHtml}</ul>
            <div class="total">الإجمالي: ${order.total} ج.م</div>
          </div>
        `;
            }).join('');
        }


    </script>
</body>

</html>
