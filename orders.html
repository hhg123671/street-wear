<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>طلبات العملاء</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(180deg, #f7f7f7 0%, #eef2ff 100%);
            color: #111;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            color: #111;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 8px 18px rgba(17, 17, 17, 0.04);
        }

        .filters {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) repeat(2, minmax(150px, 190px));
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-input,
        .filter-select {
            width: 100%;
            border: 1px solid #dfe3eb;
            background: #fff;
            color: #1f2937;
            border-radius: 10px;
            padding: 11px 12px;
            font-size: 14px;
            outline: none;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);
        }

        .results-count {
            color: #6b7280;
            font-size: 13px;
            margin: -10px 0 16px;
        }

        .toolbar button,
        .status-select,
        .folder-select,
        .small-btn {
            border: 1px solid #dfe3eb;
            background: #fff;
            color: #1f2937;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .toolbar button:hover,
        .status-select:hover,
        .folder-select:hover,
        .small-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.05);
        }

        .danger-btn {
            background: #fff1f2 !important;
            border-color: #fbcfe8 !important;
            color: #be123c !important;
        }

        .copy-btn {
            background: #ecfeff !important;
            border-color: #b4f2f5 !important;
            color: #0f766e !important;
        }

        .empty {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            color: #666;
            box-shadow: 0 10px 20px rgba(17, 17, 17, 0.04);
        }

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #edf0f4;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(17, 17, 17, 0.04);
            animation: fadeUp 0.35s ease;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(17, 17, 17, 0.08);
        }

        .order-card.selected {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .customer-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .order-check {
            width: 18px;
            height: 18px;
            accent-color: #7c3aed;
            cursor: pointer;
        }

        .order-title {
            margin: 0;
            font-size: 22px;
        }

        .badges {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            background: #111;
            color: #fff;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
        }

        .badge.whatsapp {
            background: #25d366;
        }

        .badge.site {
            background: #0d6efd;
        }

        .status-tag {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #374151;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-tag.new {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status-tag.processing {
            background: #fff7ed;
            color: #b45309;
        }

        .status-tag.done {
            background: #ecfdf5;
            color: #047857;
        }

        .status-tag.cancelled {
            background: #fef2f2;
            color: #b91c1c;
        }

        .folder-badge {
            background: #eef2ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .meta {
            color: #555;
            line-height: 1.9;
            font-size: 15px;
        }

        .notes-box {
            padding: 12px 14px;
            background: #fffaf0;
            border: 1px solid #f3d9a3;
            border-radius: 12px;
            color: #7a5a10;
            margin-top: 16px;
        }

        .items {
            margin-top: 15px;
            list-style: none;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .items li {
            background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
            border: 1px solid #f1f1f1;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #f0f0f0;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #111;
        }

        .order-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .small-btn {
            padding: 9px 12px;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 90%;
            max-width: 380px;
            border: 1px solid #eee;
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .login-box input:focus {
            border-color: #111;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #333;
        }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 700px) {

            .filters {
                grid-template-columns: 1fr;
            }

            .page-header,
            .order-top,
            .order-footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>تسجيل الدخول للوحة الطلبات</h2>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" />
            <button onclick="checkPassword()">دخول</button>
            <div id="errorMsg" class="error-msg">كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <div id="mainContent" class="container" style="display: none;">
        <div class="page-header">
            <h1>طلبات العملاء</h1>
            <div class="toolbar">
                <button id="selectAllBtn">تحديد الكل</button>
                <button id="clearSelectionBtn">إلغاء التحديد</button>
                <button id="deleteSelectedBtn" class="danger-btn">حذف المحدد</button>
                <button id="moveSelectedBtn">نقل إلى مجلد</button>
                <button id="copySelectedBtn" class="copy-btn">نسخ المحدد</button>
                <button id="copyAllBtn">نسخ الكل</button>
                <button id="exportBtn">تصدير CSV</button>
            </div>
        </div>
        <div class="filters">
            <input id="searchInput" class="filter-input" type="search"
                placeholder="بحث بالاسم أو الهاتف أو الملاحظات" />
            <select id="statusFilter" class="filter-select">
                <option value="all">كل الحالات</option>
                <option value="جديد">جديد</option>
                <option value="قيد المعالجة">قيد المعالجة</option>
                <option value="مكتمل">مكتمل</option>
                <option value="ملغي">ملغي</option>
            </select>
            <select id="folderFilter" class="filter-select">
                <option value="all">كل المجلدات</option>
                <option value="عام">عام</option>
                <option value="ملابس">ملابس</option>
                <option value="أحذية">أحذية</option>
                <option value="إكسسوارات">إكسسوارات</option>
                <option value="مؤجل">مؤجل</option>
            </select>
        </div>
        <div id="resultsCount" class="results-count"></div>
        <div id="ordersContainer" class="orders"></div>
    </div>

    <script>
        const SECRET_PASSWORD = '123456';
        const STORAGE_KEY = 'streetwear_orders';
        const STATUS_OPTIONS = ['جديد', 'قيد المعالجة', 'مكتمل', 'ملغي'];
        const FOLDER_OPTIONS = ['عام', 'ملابس', 'أحذية', 'إكسسوارات', 'مؤجل'];

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (input === SECRET_PASSWORD) {
                sessionStorage.setItem('is_admin_logged_in', 'true');
                showProtectedContent();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function showProtectedContent() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            renderOrders();
        }

        function getOrders() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (error) {
                console.warn('localStorage failed, fallback to sessionStorage', error);
            }

            try {
                const savedSession = sessionStorage.getItem(STORAGE_KEY);
                if (savedSession) return JSON.parse(savedSession);
            } catch (error) {
                console.warn('sessionStorage failed', error);
            }

            return [];
        }

        function saveOrders(orders) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
            } catch (error) {
                console.warn('localStorage save failed, using sessionStorage', error);
            }

            try {
                sessionStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
            } catch (error) {
                console.warn('sessionStorage save failed', error);
            }
        }

        function formatStatus(value) {
            return value || 'جديد';
        }

        function formatFolder(value) {
            return value || 'عام';
        }

        function statusClass(value) {
            const map = {
                'جديد': 'new',
                'قيد المعالجة': 'processing',
                'مكتمل': 'done',
                'ملغي': 'cancelled'
            };
            return map[value] || 'new';
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }

            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            temp.remove();
            return Promise.resolve();
        }

        function getSelectedIds() {
            return [...document.querySelectorAll('.order-check:checked')].map(el => Number(el.dataset.id));
        }

        function getVisibleOrders() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const folder = document.getElementById('folderFilter').value;

            return getOrders().filter(order => {
                const searchable = [order.name, order.phone, order.notes].filter(Boolean).join(' ').toLowerCase();
                return (!query || searchable.includes(query))
                    && (status === 'all' || formatStatus(order.status) === status)
                    && (folder === 'all' || formatFolder(order.folder) === folder);
            });
        }

        function buildOrderText(order) {
            const items = (order.items || []).map(item => `- ${item.title} (${item.selectedColor} / ${item.selectedSize}) × ${item.qty}`).join('\n');
            return `الاسم: ${order.name}\nالهاتف: ${order.phone}\nالمجلد: ${formatFolder(order.folder)}\nالحالة: ${formatStatus(order.status)}\nملاحظات: ${order.notes || 'لا توجد'}\nالمنتجات:\n${items}\nالإجمالي: ${order.total} ج.م`;
        }

        function deleteOrder(id) {
            const orders = getOrders().filter(order => Number(order.id) !== Number(id));
            saveOrders(orders);
            renderOrders();
        }

        function deleteSelected() {
            const selectedIds = getSelectedIds();
            if (!selectedIds.length) {
                alert('اختر طلبًا واحدًا على الأقل للحذف.');
                return;
            }

            const orders = getOrders().filter(order => !selectedIds.includes(Number(order.id)));
            saveOrders(orders);
            renderOrders();
        }

        function moveSelected() {
            const selectedIds = getSelectedIds();
            if (!selectedIds.length) {
                alert('اختر طلبًا واحدًا على الأقل لنقله.');
                return;
            }

            const folder = prompt(`اكتب اسم المجلد الجديد (${FOLDER_OPTIONS.join('، ')}):`, 'عام');
            if (!folder || !folder.trim()) return;

            const orders = getOrders().map(order => selectedIds.includes(Number(order.id))
                ? { ...order, folder: folder.trim() }
                : order);
            saveOrders(orders);
            renderOrders();
        }

        function copySelected() {
            const selectedIds = getSelectedIds();
            if (!selectedIds.length) {
                alert('اختر طلبًا واحدًا على الأقل قبل النسخ.');
                return;
            }

            const orders = getOrders();
            const selectedOrders = orders.filter(order => selectedIds.includes(Number(order.id)));
            const text = selectedOrders.map(buildOrderText).join('\n\n');

            copyText(text)
                .then(() => alert('تم نسخ الطلبات المحددة.'))
                .catch(() => alert('حدثت مشكلة أثناء النسخ.'));
        }

        function copyAll() {
            const orders = getVisibleOrders();
            if (!orders.length) {
                alert('لا توجد طلبات لنسخها.');
                return;
            }

            const text = orders.slice().reverse().map(buildOrderText).join('\n\n');
            copyText(text)
                .then(() => alert('تم نسخ كل الطلبات.'))
                .catch(() => alert('حدثت مشكلة أثناء النسخ.'));
        }

        function csvCell(value) {
            return `"${String(value ?? '').replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`;
        }

        function exportCsv() {
            const orders = getVisibleOrders();
            if (!orders.length) {
                alert('لا توجد طلبات مطابقة للتصدير.');
                return;
            }

            const header = ['الاسم', 'الهاتف', 'التاريخ', 'الحالة', 'المجلد', 'الملاحظات', 'المنتجات', 'الإجمالي'];
            const rows = orders.map(order => [
                order.name,
                order.phone,
                new Date(order.createdAt).toLocaleString('ar-EG'),
                formatStatus(order.status),
                formatFolder(order.folder),
                order.notes || '',
                (order.items || []).map(item => `${item.title} (${item.selectedColor} / ${item.selectedSize}) x ${item.qty}`).join(' | '),
                `${order.total} ج.م`
            ]);
            const csv = '\uFEFF' + [header, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `orders-${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function updateOrder(id, field, value) {
            const orders = getOrders();
            const target = orders.find(order => Number(order.id) === Number(id));
            if (!target) return;
            target[field] = value;
            saveOrders(orders);
            renderOrders();
        }

        function bindActions() {
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteOrder(btn.dataset.id));
            });

            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = Number(btn.dataset.id);
                    const order = getOrders().find(item => Number(item.id) === id);
                    if (!order) return;

                    copyText(buildOrderText(order))
                        .then(() => alert('تم نسخ تفاصيل الطلب.'))
                        .catch(() => alert('حدثت مشكلة أثناء النسخ.'));
                });
            });

            document.querySelectorAll('.status-select').forEach(select => {
                select.addEventListener('change', (event) => {
                    updateOrder(select.dataset.id, 'status', event.target.value);
                });
            });

            document.querySelectorAll('.folder-select').forEach(select => {
                select.addEventListener('change', (event) => {
                    updateOrder(select.dataset.id, 'folder', event.target.value);
                });
            });

            document.querySelectorAll('.order-check').forEach(check => {
                check.addEventListener('change', () => {
                    const card = check.closest('.order-card');
                    if (card) {
                        card.classList.toggle('selected', check.checked);
                    }
                });
            });
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const allOrders = getOrders();
            const orders = getVisibleOrders();
            document.getElementById('resultsCount').textContent = `عرض ${orders.length} من أصل ${allOrders.length} طلب`;

            if (!orders.length) {
                container.innerHTML = allOrders.length
                    ? '<div class="empty">لا توجد طلبات تطابق البحث أو الفلاتر الحالية.</div>'
                    : '<div class="empty">لا توجد طلبات حتى الآن.<br>قم بإرسال طلب من صفحة المتجر ثم أعد فتح هذه الصفحة.</div>';
                return;
            }

            container.innerHTML = orders.slice().reverse().map(order => {
                const itemsHtml = (order.items || []).map(item => `
                    <li>
                        <span>${item.title}</span>
                        <span>${item.selectedColor} / ${item.selectedSize}</span>
                        <span>الكمية: ${item.qty}</span>
                        <span>${item.price * item.qty} ج.م</span>
                    </li>
                `).join('');

                const statusValue = formatStatus(order.status);
                const folderValue = formatFolder(order.folder);

                return `
                    <div class="order-card">
                        <div class="order-top">
                            <div class="customer-info">
                                <input class="order-check" type="checkbox" data-id="${order.id}" aria-label="تحديد الطلب">
                                <h3 class="order-title">${order.name}</h3>
                            </div>

                            <div class="badges">
                                <span class="badge ${order.mode === 'whatsapp' ? 'whatsapp' : 'site'}">
                                    ${order.mode === 'whatsapp' ? 'واتساب' : 'من الموقع'}
                                </span>
                                <span class="status-tag ${statusClass(statusValue)}">${statusValue}</span>
                                <span class="folder-badge">📁 ${folderValue}</span>
                            </div>
                        </div>

                        <div class="meta">
                            <div>الهاتف: ${order.phone}</div>
                            <div>التاريخ: ${new Date(order.createdAt).toLocaleString('ar-EG')}</div>
                        </div>

                        ${order.notes ? `<div class="notes-box">📝 ${order.notes}</div>` : ''}

                        <ul class="items">${itemsHtml}</ul>

                        <div class="order-footer">
                            <div class="total">الإجمالي: ${order.total} ج.م</div>
                            <div class="order-actions">
                                <select class="status-select" data-id="${order.id}">
                                    ${STATUS_OPTIONS.map(status => `<option value="${status}" ${status === statusValue ? 'selected' : ''}>${status}</option>`).join('')}
                                </select>

                                <select class="folder-select" data-id="${order.id}">
                                    ${FOLDER_OPTIONS.map(folder => `<option value="${folder}" ${folder === folderValue ? 'selected' : ''}>${folder}</option>`).join('')}
                                </select>

                                <button class="copy-btn small-btn" data-id="${order.id}">نسخ</button>
                                <button class="danger-btn small-btn delete-btn" data-id="${order.id}">حذف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            bindActions();
        }

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.order-check').forEach(check => check.checked = true);
            document.querySelectorAll('.order-card').forEach(card => card.classList.add('selected'));
        });

        document.getElementById('clearSelectionBtn').addEventListener('click', () => {
            document.querySelectorAll('.order-check').forEach(check => check.checked = false);
            document.querySelectorAll('.order-card').forEach(card => card.classList.remove('selected'));
        });

        document.getElementById('deleteSelectedBtn').addEventListener('click', deleteSelected);
        document.getElementById('moveSelectedBtn').addEventListener('click', moveSelected);
        document.getElementById('copySelectedBtn').addEventListener('click', copySelected);
        document.getElementById('copyAllBtn').addEventListener('click', copyAll);
        document.getElementById('exportBtn').addEventListener('click', exportCsv);
        document.getElementById('searchInput').addEventListener('input', renderOrders);
